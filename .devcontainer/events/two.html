<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Code with gaurav</h1>
    <button id="stop">Stop</button>
</body>
<script>
    const sayGaurav=function () {
        console.log("Gaurav");
        
    }
    const textChange=function (){
        document.querySelector('h1').innerHTML="Gaurav coding"
        
    }
    
    const stopMe = setTimeout(textChange,2000)//Name will be printed after 2 seconds.

    //clear timeout()=>stop setTimeout before execution

    document.querySelector('#stop').addEventListener('click',function(){
        clearTimeout(stopMe)
        console.log("STOPPED!");
        
    })

</script>
</html>
