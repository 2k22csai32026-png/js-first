<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: rgb(212, 222, 222);">
    <!-- '''0	UNSENT	Request created but open() not called
    1	OPENED	open() called
    2	HEADERS_RECEIVED	Server received request
    3	LOADING	Response is downloading
    4	DONE	Request completed''' -->

</body>
<script>
    const requestURL='https://api.github.com/users/2k22csai32026-png'
    const xhr=new XMLHttpRequest()
    xhr.open('GET',requestURL)
    xhr.onreadystatechange=function(){
        console.log(xhr.readyState);
        if(xhr.readyState===4){
            const data=JSON.parse(this.responseText)
            console.log(data);
            console.log(data.company);
            
            
        }
    }   
    xhr.send()
</script>
</html>
